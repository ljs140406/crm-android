name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: '版本号（versionName，如 1.2.0）'
        required: true
        default: '1.0.0'
      releaseNotes:
        description: '更新说明（显示在更新弹窗里，可留空）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build-tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          VN="${{ github.event.inputs.versionName }}"
          VN=$(echo "$VN" | grep -oE '^[0-9]+(\.[0-9]+)*' | head -1)
          [ -z "$VN" ] && VN="1.0.0"
          VC="${{ github.run_number }}"
          echo "versionName=$VN" >> "$GITHUB_OUTPUT"
          echo "versionCode=$VC" >> "$GITHUB_OUTPUT"
          echo "tag=v$VN" >> "$GITHUB_OUTPUT"
          echo "解析到 versionName=$VN versionCode=$VC"

      - name: Decode keystore
        shell: bash
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secret：KEYSTORE_BASE64 未配置"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/crm-release.keystore
          ls -l android/app/crm-release.keystore
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::缺少 Secret：KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD"
            exit 1
          fi

      - name: Install npm deps
        run: npm ci || npm install

      - name: Inject app version into update script
        run: |
          sed -i "s/__APP_VERSION__/${{ steps.ver.outputs.versionName }}/g" www/android-update.js
          grep -o "APP_VERSION = '[^']*'" www/android-update.js

      - name: Sync web assets
        run: npx cap sync android

      - name: Build release APK
        env:
          ORG_GRADLE_PROJECT_appVersionName: ${{ steps.ver.outputs.versionName }}
          ORG_GRADLE_PROJECT_appVersionCode: ${{ steps.ver.outputs.versionCode }}
          ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Zipalign + apksigner
        id: sign
        shell: bash
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          echo "build-tools: $BUILD_TOOLS"
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=android/app/build/outputs/apk/release/app-release-aligned.apk
          OUT=android/app/build/outputs/apk/release/crm-android-${{ steps.ver.outputs.versionName }}.apk
          "$BUILD_TOOLS/zipalign" -p 4 "$IN" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks android/app/crm-release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out "$OUT" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          ls -l "$OUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 客户跟进管理 ${{ steps.ver.outputs.versionName }}
          body: ${{ github.event.inputs.releaseNotes || '功能改进与问题修复。' }}
          files: ${{ steps.sign.outputs.apk }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
