name: Build Android APK (转发)

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: '版本号（versionName，如 1.2.0）'
        required: true
        default: '1.0.0'
      releaseNotes:
        description: '更新说明'
        required: false
        default: ''

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: 转发到 ci/build-android.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci%2Fbuild-android.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"versionName\":\"${{ github.event.inputs.versionName }}\",\"releaseNotes\":\"${{ github.event.inputs.releaseNotes }}\"}}"
