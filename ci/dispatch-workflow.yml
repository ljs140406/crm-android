name: Build Android APK (转发)

# 这个文件请「手动」粘贴到 GitHub 网页端 .github/workflows/build-android.yml
# （沙箱代理禁止通过 API 写入 .github/workflows/ 路径，但网页端可以）。
# 它的唯一作用：把构建请求转发给真正干活的 ci/build-android.yml。
#
# 粘贴后，在 Actions 页面点「Build Android APK (转发) → Run workflow」即可，
# 它会自动触发 ci/build-android.yml 完成构建与发布。

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: '版本号（versionName，如 1.2.0）'
        required: true
        default: '1.0.0'
      releaseNotes:
        description: '更新说明'
        required: false
        default: ''

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: 转发到 ci/build-android.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci%2Fbuild-android.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"versionName\":\"${{ github.event.inputs.versionName }}\",\"releaseNotes\":\"${{ github.event.inputs.releaseNotes }}\"}}"
